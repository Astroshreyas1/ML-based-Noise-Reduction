<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hub situation map</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/milsymbol@2.2.0/dist/milsymbol.js"></script>
<style>
:root{--bg:#0f1115;--panel:#171a21;--ink:#e8eaed;--mute:#9aa0a6;--line:#2a2f3a;--enemy:#e5484d;--friend:#3e63dd;--cas:#f5a524;--fire:#f76b15;--ok:#46a758}
*{box-sizing:border-box}body{margin:0;height:100vh;display:grid;grid-template-columns:1fr 420px;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,sans-serif}
#map{height:100vh}#side{display:flex;flex-direction:column;height:100vh;border-left:1px solid var(--line);background:var(--panel)}
header{padding:12px 14px;border-bottom:1px solid var(--line)}header b{font-size:16px}#live{color:var(--ok);font-size:12px}
#partial{padding:8px 14px;min-height:38px;color:var(--mute);font-style:italic;border-bottom:1px solid var(--line)}
#feed{flex:1;overflow:auto;padding:8px 10px}.tx{padding:8px 10px;margin:6px 0;border-radius:10px;background:#1d212a;border:1px solid var(--line)}
.tx .t{color:var(--mute);font-size:11px}.tx .txt{margin:3px 0}.chip{display:inline-block;padding:1px 8px;margin:2px 3px 0 0;border-radius:99px;font-size:11px;font-weight:600;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.lat{color:var(--mute);font-size:11px;margin-top:3px}.llm{color:#8e4ec6;font-size:12px}
@media (max-width:800px){body{grid-template-columns:1fr;grid-template-rows:55vh 45vh}#map{height:55vh}#side{height:45vh}}
</style></head><body>
<div id="map"></div>
<div id="side"><header><b>Radio hub — live picture</b> <span id="live">● connecting</span><div style="color:var(--mute);font-size:12px">square __SQUARE__ · markers from rules / Laya (deterministic); LLM proposals only if grounded in the transcript</div></header>
<div id="partial">…</div><div id="feed"></div></div>
<script>
const sq = "__SQUARE__";
const map = L.map('map', {zoomControl: true});
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom: 17, attribution: '© OpenStreetMap'}).addTo(map);
const layer = L.layerGroup().addTo(map), gridL = L.layerGroup().addTo(map);
const colors = {enemy: '#e5484d', friendly: '#3e63dd', casualty: '#f5a524', fire_mission: '#f76b15', check_fire: '#f76b15', note: '#9aa0a6'};
const sidc = {enemy: 'SHGPU------', friendly: 'SFGPU------', casualty: 'SFGPUSM----', fire_mission: 'GHFPPTS----', check_fire: 'GHFPPTS----', note: 'SUGP-------'};
let fitted = false;
function icon(m){
  try { const s = new ms.Symbol(sidc[m.kind] || 'SUGP-------', {size: 26, uniqueDesignation: m.label.slice(0, 18)});
        return L.divIcon({className: '', html: s.asSVG(), iconAnchor: [s.getAnchor().x, s.getAnchor().y]}); }
  catch(e){ return undefined; }
}
function addMarker(m){
  const c = colors[m.kind] || '#999';
  const unconf = m.details && m.details.confirmed === false;
  const box = L.rectangle(L.latLng(m.lat, m.lon).toBounds(m.half_m * 2), {color: c, weight: unconf ? 2 : 1, dashArray: unconf ? '6 6' : null, fillOpacity: unconf ? 0.02 : 0.08}).addTo(layer);
  const mk = L.marker([m.lat, m.lon], {icon: icon(m)}).addTo(layer);
  const det = Object.entries(m.details || {}).filter(([k, v]) => v && k !== 'llm').map(([k, v]) => `${k}: ${v}`).join('<br>');
  mk.bindPopup(`<b>${m.label}</b><br>grid ${sq} ${m.grid} (±${m.half_m} m)<br>${det}<br>source: ${m.source}<br><audio controls src="/api/audio/${m.tx}" style="width:220px"></audio>`);
  if (!fitted) { map.setView([m.lat, m.lon], 12); fitted = true; }
}
function chip(t, c){ return `<span class="chip" style="--c:${c}">${t}</span>`; }
function addTx(t){
  const e = t.extraction || {}, d = t.decisions || {}, L_ = t.latency || {};
  let chips = (e.types || []).map(x => chip(x, '#3e63dd')).join('') + (e.grids || []).map(g => chip('grid ' + g, '#46a758')).join('');
  if (d.msg_type) chips += chip(`laya: ${d.msg_type} ${(d.msg_type_conf*100|0)}%`, '#8e4ec6') + chip(`urgency ${d.urgency.toFixed(1)}`, '#f5a524');
  const lat = Object.entries(L_).map(([k, v]) => `${k} ${(+v).toFixed(0)}`).join(' · ');
  const div = document.createElement('div'); div.className = 'tx'; div.id = 'tx-' + t.id;
  div.innerHTML = `<div class="t">${new Date(t.t * 1000).toLocaleTimeString()} · ${t.id}${e.from ? ' · from ' + e.from : ''}${e.to ? ' → ' + e.to : ''}</div><div class="txt">${t.text || '<i>(no text)</i>'}</div>${chips}<div class="lat">${lat}</div><div class="llm"></div>`;
  const f = document.getElementById('feed'); f.prepend(div);
}
fetch('/api/state').then(r => r.json()).then(s => { s.markers.forEach(addMarker); s.transmissions.forEach(addTx); if (!fitted) map.setView([48.5, 14.3], 10); });
const es = new EventSource('/events');
es.onopen = () => { document.getElementById('live').textContent = '● live'; };
es.onerror = () => { document.getElementById('live').textContent = '● reconnecting'; };
es.addEventListener('partial', e => { const d = JSON.parse(e.data); document.getElementById('partial').textContent = d.text || '…'; });
es.addEventListener('transmission', e => { addTx(JSON.parse(e.data)); document.getElementById('partial').textContent = '…'; });
es.addEventListener('marker', e => addMarker(JSON.parse(e.data)));
es.addEventListener('enrich', e => { const d = JSON.parse(e.data); const el = document.querySelector('#tx-' + d.id + ' .llm');
  if (el) el.textContent = 'LLM (grounded): ' + JSON.stringify(d.kept) + (d.dropped.length ? '  dropped: ' + d.dropped.join(', ') : ''); });
</script></body></html>
