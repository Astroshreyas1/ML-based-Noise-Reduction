[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ancdata"
version = "0.1.0"
description = "Scalable noisy-clean speech pair generator for defence AI-ANC / speech enhancement"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11",
    "soundfile>=0.12",
    "librosa>=0.10",
    "pyroomacoustics>=0.7",
    "pandas>=2.0",
    "pyarrow>=14",
    "pyyaml>=6",
    "tqdm>=4.65",
    "matplotlib>=3.7",
    "pyworld>=0.3.4",
]

[project.optional-dependencies]
vad = ["webrtcvad-wheels>=2.0.14"]
metrics = ["pesq>=0.0.4", "pystoi>=0.4", "tabulate>=0.9"]
torch = ["torch>=2.3", "torchaudio>=2.3", "onnx>=1.16", "onnxscript>=0.1", "onnxruntime>=1.18"]
dev = ["pytest>=7"]
all = ["ancdata[vad,metrics,dev]"]

[project.scripts]
ancdata = "ancdata.cli:main"

[tool.setuptools.packages.find]
include = ["ancdata*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
