# Battlefield dataset v4 -- "one space, few objects". The config IS the specification;
# the order of operations is code (ancdata/battlefield_v4.py). Why each number:
# docs/NOISE_LAYERING.md section 8 (research 2026-09-26: shared scene acoustics,
# distance cues, polyphony budget, onset-aligned events, no loops).
name: battlefield_v4
seed: 20260917                  # same speech permutation as v3: index k has the same snippet in both
sample_rate: 16000
segment_seconds: 6.0
channels: [boom, ref]
target: dry_x_agc

speech:
  snippets: snippets/lombard6s
  lombard_class_only: true
  level_db: {dist: uniform, low: -32, high: -18}
  max_scenes_per_snippet: {train: 10, val: 4, test: 8}

mix:
  snr_db: {dist: uniform, low: -8, high: 15}    # K-weighted loudness, speech vs continuous scene
  bed2_p: 0.4                                   # a second, different bed (e.g. wind over rural ambience)
  bed2_rel_db: {dist: uniform, low: -9, high: -3}
  bed_envelope: {gust_depth_db: {dist: uniform, low: 2, high: 8}, gust_rate_hz: {dist: uniform, low: 0.15, high: 0.8}}
  bed_xfade_s: 0.6
  envelopes: {gust_depth_db: {dist: uniform, low: 3, high: 10}, gust_rate_hz: {dist: uniform, low: 0.2, high: 1.0}}   # capsule wind (v3 helper)

budget:                                        # polyphony: STARSS23 / SINGA:PURA / Murch (<= 5 layers)
  foreground_count_p: [0.15, 0.40, 0.35, 0.10] # P(0, 1, 2, 3 foreground events)
  texture_count_p: [0.35, 0.45, 0.20]          # P(0, 1, 2 textures)
  max_labels: 6                                # distinct labels per clip (beds + foreground + texture + wind_mic)
  max_overlap: 2                               # foreground events sounding at the same instant
  min_onset_gap_s: 0.25                        # between unrelated foreground onsets
  quiet_after_impulse_s: 0.4                   # no texture right after a shot / blast (masked, AGC ducking)
  place_tries: 30

gunfire:                                       # p is per scenario; overall rate is checked (~0.5)
  second_burst_p: 0.35
  auto_p: 0.6
  rounds_auto: {dist: uniform_int, low: 4, high: 9}
  rounds_semi: {dist: uniform_int, low: 1, high: 4}
  spacing_auto_s: {dist: uniform, low: 0.067, high: 0.092}
  spacing_semi_s: {dist: uniform, low: 0.15, high: 0.4}
  source_p: {physics: 0.5, field: 0.3, mad: 0.2}
  distance_p: {near: 0.4, mid: 0.4, far: 0.2}
  peak_ratio_db:                               # burst peak vs speech peak, by distance (v3 near range kept)
    near: {dist: uniform, low: -3, high: 10}
    mid: {dist: uniform, low: -8, high: 4}
    far: {dist: uniform, low: -16, high: -4}

blasts:
  source_p: {physics: 0.5, fsd: 0.25, mad: 0.25}
  distance_p: {mid: 0.5, far: 0.5}             # mid -> blast_near, far -> blast_distant
  standoff_m: {mid: [40, 200], far: [300, 3000]}
  peak_ratio_db:
    mid: {dist: uniform, low: -6, high: 6}
    far: {dist: uniform, low: -16, high: -3}
  debris_p: 0.5                                # debris follow-on after a blast_near, 0.3-1.5 s later
  debris_delay_s: {dist: uniform, low: 0.3, high: 1.5}
  debris_rel_db: {dist: uniform, low: -10, high: -2}

# Label catalogue. role: bed (whole clip, dry ambient recording) | recurrent (seconds-long, propagated)
# | texture (short, near, propagated) | channel (at the capsule, dry).
labels:
  ambience_rural:   {coarse: ambience,       role: bed, pools: [demand_nfield, demand_npark, demand_nriver, fsd_nature, fsd_water]}
  ambience_urban:   {coarse: ambience,       role: bed, pools: [demand_straffic, demand_spsquare, fsd_traffic]}
  vehicle_interior: {coarse: ground_vehicle, role: bed, pools: [demand_tbus, demand_tcar, demand_tmetro]}
  wind_ambient:     {coarse: weather,        role: bed, pools: [fsd_wind, esc50_wind]}
  rain:             {coarse: weather,        role: bed, pools: [fsd_rain, esc50_rain]}
  engine_machinery: {coarse: ground_vehicle, role: bed, pools: [fsd_engine, us8k_engine_idling, esc50_engine, fsd_fan]}
  fire_crackle:     {coarse: ambience,       role: bed, pools: [fsd_fire, esc50_crackling_fire]}
  vehicle_heavy:    {coarse: ground_vehicle, role: recurrent, pools: [mad_vehicle, idmt_truck, idmt_bus], dur_s: [2.5, 6.0],
                     envelopes: [passby, approach, recede, steady], distance_p: {near: 0.3, mid: 0.5, far: 0.2}}
  vehicle_light:    {coarse: ground_vehicle, role: recurrent, pools: [idmt_car, idmt_motorcycle], real_passby: true,
                     distance_p: {near: 0.5, mid: 0.5}}
  helicopter:       {coarse: aircraft,       role: recurrent, pools: [mad_helicopter, esc50_helicopter], dur_s: [3.0, 6.0],
                     envelopes: [approach, recede, passby, steady], distance_p: {near: 0.3, mid: 0.4, far: 0.3}}
  jet_aircraft:     {coarse: aircraft,       role: recurrent, pools: [mad_fighter, fsd_aircraft, esc50_airplane], dur_s: [3.0, 6.0],
                     envelopes: [passby, approach, recede], distance_p: {mid: 0.5, far: 0.5}}
  drone_uav:        {coarse: aircraft,       role: recurrent, pools: [drone], dur_s: [2.0, 6.0], envelopes: [steady, approach, recede],
                     distance_p: {near: 0.5, mid: 0.5}}
  siren_alarm:      {coarse: alarm,          role: recurrent, pools: [us8k_siren, esc50_siren, fsd_siren], dur_s: [2.0, 5.0],
                     envelopes: [steady, passby], distance_p: {mid: 0.6, far: 0.4}}
  speech_interferer: {coarse: human,         role: recurrent, pools: [fsd_interferer, mad_communication], dur_s: [0.8, 3.0],
                     onset: true, distance_p: {mid: 0.7, far: 0.3}}
  thunder:          {coarse: weather,        role: recurrent, pools: [fsd_thunder, esc50_thunderstorm], dur_s: [1.5, 4.0],
                     onset: true, distance_p: {far: 1.0}}
  footsteps_gear:   {coarse: human,          role: texture, pools: [mad_footsteps, esc50_footsteps, fsd_gear], dur_s: [0.3, 1.5]}
  radio_squelch:    {coarse: channel,        role: texture, synth: squelch}
  hard_negative:    {coarse: impact,         role: texture, pools: [fsd_hardneg, esc50_door_wood_knock, fsd_fireworks, esc50_fireworks],
                     dur_s: [0.2, 1.0]}
  debris_impact:    {coarse: explosion,      role: texture, pools: [fsd_debris, esc50_glass_breaking], dur_s: [0.4, 2.0]}
  # impulsive labels (rendered by transients.py, named from render parameters, not the pool):
  # gunfire_semi | gunfire_auto (near / mid) | gunfire_distant (far) | blast_near (mid) | blast_distant (far)
  # channel label: wind_mic (capsule wind + buffets)

levels:                                        # dB re the (unit-loudness) bed, by distance class
  recurrent:
    near: {dist: uniform, low: -3, high: 5}
    mid: {dist: uniform, low: -9, high: -1}
    far: {dist: uniform, low: -16, high: -8}
  texture: {dist: uniform, low: -18, high: -8}
  pp_only_pools: [fsd_explosion, fsd_gunshot, fsd_debris, fsd_gear, fsd_hardneg, fsd_fireworks, fsd_interferer]

wind:
  pools: [esc50_wind, fsd_wind]
  rel_db: {dist: uniform, low: -10, high: 0}
  gust_depth_db: {dist: uniform, low: 3, high: 10}
  gust_rate_hz: {dist: uniform, low: 0.2, high: 1.0}
  buffets: {count: {dist: uniform_int, low: 0, high: 3}, dur_s: {dist: uniform, low: 0.08, high: 0.4},
            rel_db: {dist: uniform, low: -6, high: 6}}

augment:
  biquad_r: 0.375                              # Braun & Tashev random biquad per noise source

# Scenarios: env = environment weights; beds = bed label weights; bed2 = second-bed options;
# gunfire_p = chance of small-arms fire; foreground = weights of other foreground labels
# (blast counts as a label here); texture = texture label weights.
scenarios:
  - {name: firefight, weight: 1.3, env: {open_field: 0.5, forest: 0.3, urban: 0.2},
     beds: {ambience_rural: 0.6, wind_ambient: 0.4}, bed2: [wind_ambient, ambience_rural], wind_p: 0.5, gunfire_p: 0.95,
     foreground: {blast: 0.4, vehicle_heavy: 0.3, speech_interferer: 0.5, helicopter: 0.15},
     texture: {footsteps_gear: 0.6, radio_squelch: 0.3, hard_negative: 0.1}}
  - {name: artillery, weight: 1.0, env: {open_field: 0.6, forest: 0.4},
     beds: {wind_ambient: 0.5, ambience_rural: 0.5}, bed2: [wind_ambient, rain], wind_p: 0.7, gunfire_p: 0.4,
     foreground: {blast: 1.0, speech_interferer: 0.3, vehicle_heavy: 0.2},
     texture: {footsteps_gear: 0.4, radio_squelch: 0.4, hard_negative: 0.1}}
  - {name: convoy, weight: 1.0, env: {open_field: 0.7, urban: 0.3},
     beds: {engine_machinery: 0.7, ambience_rural: 0.3}, bed2: [wind_ambient], wind_p: 0.6, gunfire_p: 0.45,
     foreground: {vehicle_heavy: 0.6, vehicle_light: 0.3, helicopter: 0.3, jet_aircraft: 0.15, blast: 0.2},
     texture: {radio_squelch: 0.5, footsteps_gear: 0.3, hard_negative: 0.1}}
  - {name: helo_lz, weight: 0.9, env: {open_field: 0.8, forest: 0.2},
     beds: {wind_ambient: 1.0}, bed2: [ambience_rural], wind_p: 1.0, gunfire_p: 0.3,
     foreground: {helicopter: 1.0, speech_interferer: 0.4, vehicle_heavy: 0.2},
     texture: {footsteps_gear: 0.5, radio_squelch: 0.4}}
  - {name: urban_patrol, weight: 1.0, env: {urban: 1.0},
     beds: {ambience_urban: 1.0}, bed2: [wind_ambient, engine_machinery], wind_p: 0.3, gunfire_p: 0.6,
     foreground: {siren_alarm: 0.4, vehicle_light: 0.5, speech_interferer: 0.5, blast: 0.25, drone_uav: 0.15},
     texture: {footsteps_gear: 0.6, hard_negative: 0.2, radio_squelch: 0.3}}
  - {name: vehicle_interior, weight: 0.8, env: {cabin: 1.0},
     beds: {vehicle_interior: 0.6, engine_machinery: 0.4}, bed2: [engine_machinery], wind_p: 0.0, gunfire_p: 0.35,
     foreground: {blast: 0.3, helicopter: 0.2}, texture: {radio_squelch: 0.7, hard_negative: 0.2}}
  - {name: jet_flyover, weight: 0.7, env: {open_field: 0.7, forest: 0.3},
     beds: {ambience_rural: 0.7, wind_ambient: 0.3}, bed2: [wind_ambient], wind_p: 0.6, gunfire_p: 0.3,
     foreground: {jet_aircraft: 1.0, blast: 0.3}, texture: {footsteps_gear: 0.4, radio_squelch: 0.3}}
  - {name: drone_threat, weight: 0.8, env: {open_field: 0.5, forest: 0.3, urban: 0.2},
     beds: {ambience_rural: 0.6, wind_ambient: 0.4}, bed2: [wind_ambient], wind_p: 0.5, gunfire_p: 0.55,
     foreground: {drone_uav: 1.0, blast: 0.4, speech_interferer: 0.3}, texture: {footsteps_gear: 0.4, radio_squelch: 0.3}}
  - {name: rain_night, weight: 0.7, env: {forest: 0.6, open_field: 0.4},
     beds: {rain: 1.0}, bed2: [wind_ambient], wind_p: 0.5, gunfire_p: 0.35,
     foreground: {thunder: 0.6, vehicle_heavy: 0.3, blast: 0.2}, texture: {footsteps_gear: 0.5, radio_squelch: 0.3}}
  - {name: field_quiet, weight: 0.8, env: {open_field: 0.6, forest: 0.4},
     beds: {ambience_rural: 1.0}, bed2: [wind_ambient], wind_p: 0.6, gunfire_p: 0.15,
     foreground: {vehicle_heavy: 0.3, jet_aircraft: 0.3, helicopter: 0.2, speech_interferer: 0.2},
     texture: {footsteps_gear: 0.8, radio_squelch: 0.2}}
  - {name: fob_camp, weight: 0.7, env: {open_field: 0.6, urban: 0.4},
     beds: {engine_machinery: 1.0}, bed2: [wind_ambient, ambience_rural], wind_p: 0.4, gunfire_p: 0.2,
     foreground: {helicopter: 0.4, vehicle_heavy: 0.4, speech_interferer: 0.5, siren_alarm: 0.2},
     texture: {footsteps_gear: 0.6, radio_squelch: 0.4, hard_negative: 0.2}}
  - {name: aftermath, weight: 0.6, env: {urban: 0.6, open_field: 0.4},
     beds: {fire_crackle: 0.6, ambience_urban: 0.4}, bed2: [wind_ambient, fire_crackle], wind_p: 0.5, gunfire_p: 0.45,
     foreground: {blast: 0.5, siren_alarm: 0.4, speech_interferer: 0.5, vehicle_light: 0.2},
     texture: {footsteps_gear: 0.5, debris_impact: 0.4, radio_squelch: 0.3}}
  - {name: distant_battle, weight: 0.8, env: {open_field: 0.6, forest: 0.4},
     beds: {ambience_rural: 0.6, wind_ambient: 0.4}, bed2: [wind_ambient], wind_p: 0.6, gunfire_p: 0.8, far_only: true,
     foreground: {blast: 0.8, jet_aircraft: 0.2, helicopter: 0.2}, texture: {footsteps_gear: 0.5, radio_squelch: 0.3}}

channel:
  hp_hz: 90.0
  presence_hz: 3000.0
  presence_db: 3.0
  presence_q: 1.0
  lp_hz: 6800.0
  floor_dbfs: -55.0
  drive: 1.4
  agc_threshold_dbfs: -8.0
  agc_release_ms: 250.0
  makeup_db: 6.0
  bits: 16
  radio_p: 0.0

ref:
  speech_db: {dist: uniform, low: -18, high: -12}
  noise_db: {dist: uniform, low: 1, high: 3}
  channel: {hp_hz: 60.0, presence_db: 0.0, lp_hz: 7200.0, floor_dbfs: -52.0, drive: 1.2,
            agc_threshold_dbfs: -6.0, agc_release_ms: 150.0, makeup_db: 3.0, bits: 16}

label_audible_snr_db: -20.0     # an event whose local level is > 20 dB under the rest of the mix is marked masked

pools:
  cache_mb: 512
  allow_voice: false

build:
  fmt: {train: flac, val: flac, test: float}
  worker_mb: 900
